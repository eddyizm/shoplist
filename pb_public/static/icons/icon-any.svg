  <g transform="translate(256 256) scale(0.85) translate(-256 -256)"
     fill="#fff" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 96h72l28 112" fill="none" stroke-width="32"/>
    <path d="M160 176h304l-48 176H208z"/>
    <circle cx="224" cy="416" r="36" stroke="none"/>
    <circle cx="400" cy="416" r="36" stroke="none"/>
  </g>
</svg>
