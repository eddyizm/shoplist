<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Source artwork for the regular "any" PNG icons. Full-bleed orange so
       platforms that mask the icon still show the cart, with the cart slightly
       larger than the maskable variant for visual weight. -->
