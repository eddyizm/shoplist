<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e48500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#373c44;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e48500;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#grad1)" filter="url(#shadow)"/>

  <!-- Shopping cart icon -->
  <g transform="translate(256, 240)">
    <!-- Cart body -->
    <rect x="-40" y="0" width="80" height="60" rx="6" fill="white" opacity="0.95"/>
    <!-- Cart handle -->
    <path d="M-60,-30 L-60,0 Q-60,10 -50,10 L-20,10 Q-20,10 -10,10 L10,10 Q20,10 20,20 L20,60" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cart body - shelf -->
    <rect x="-45" y="25" width="90" height="8" rx="4" fill="white" opacity="0.9"/>
    <!-- Cart body - bottom shelf -->
    <rect x="-40" y="45" width="80" height="10" rx="4" fill="white" opacity="0.9"/>
    <!-- Item icons -->
    <circle cx="-15" cy="20" r="10" fill="white" opacity="0.9"/>
    <circle cx="15" cy="20" r="10" fill="white" opacity="0.9"/>
    <circle cx="0" cy="20" r="10" fill="white" opacity="0.9"/>
    <!-- Shopping bag outline -->
    <path d="M-30,-20 Q-30,-35 0,-35 Q30,-35 30,-20" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-30,20 Q-30,35 0,35 Q30,35 30,20" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- App name -->
  <text x="256" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="white">Shopping</text>
  <text x="256" y="330" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="white" opacity="0.9">List</text>
</svg>
